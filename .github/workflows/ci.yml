name: Evaluator checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked coursebook --help
