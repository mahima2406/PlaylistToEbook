name: Evaluator checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked coursebook --help

  # Rebuild the book from the committed book-data package (no captions, no model calls)
  # and check every file and every rebuilt book source against PACKAGE.json.
  rebuild:
    runs-on: ubuntu-latest
    if: hashFiles('book-data/PACKAGE.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked coursebook verify-package --package book-data

  # Full PDF from the package: Quarto + TinyTeX, diagrams drawn with the runner's Chrome.
  pdf:
    runs-on: ubuntu-latest
    needs: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.11"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: uv sync --locked
      - run: uv run --locked coursebook verify-package --package book-data --pdf --out rebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            rebuilt/book.pdf
            rebuilt/evaluation_report.json
            rebuilt/brief/
